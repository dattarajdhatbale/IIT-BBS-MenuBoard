<!DOCTYPE html>
<html lang="en">
<head>
        <link rel="icon" type="image/png" href="./images/logo.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IIT-BBS MenuBoard</title>

    <!-- PWA -->
    <link rel="manifest" href="./manifest.webmanifest">
    <meta name="theme-color" content="#b48bbd">
    <link rel="apple-touch-icon" href="./images/icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="MenuBoard">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Righteous&display=swap" rel="stylesheet">
        <link href="https://fonts.googleapis.com/css2?family=Playfair+Display&display=swap" rel="stylesheet">

      <!-- Stylesheet -->
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    
    <div class="container">
        <div class="header">
            <div class="title" style="width: 33%; margin: 0 auto;">Menu<span>Board</span></div>
                <button class="theme-btn" onclick="toggleTheme()">🔆 / 🌙</button>
        </div>

        <!-- PWA Install -->
        <button class="install-btn hidden" id="installBtn" onclick="installApp()">⬇ Install App</button>
        <div class="install-note hidden" id="installNote"></div>

         <!-- Selection -->
    <div class="card" id="selectionCard">
    <label>Residential Hall</label>
    <select id="hallSelect">
        <option>Mother's Touch</option>
        <option >RHR</option>
        <option >BHR</option>
        <option>MHR</option>
        <option>GHR</option>
         <option>SHR</option>

    </select>

    <Label>Day</Label>
<select id="daySelect">
             <option>Monday</option>
            <option>Tuesday</option>
            <option>Wednesday</option>
            <option>Thursday</option>
            <option>Friday</option>
            <option>Saturday</option>
            <option>Sunday</option>
</select>
        <button class="primary-btn" onclick="showMenu()">View Menu</button>
    </div>

    <!-- Menu -->
    <div class="card hidden" id="menuCard">
        <div class="back" onclick="goBack()">🔙 to Selection</div>
        <div id="menuHeader" style="font-weight:600; margin-bottom: 10px;"></div>
        <div id="menuContent"></div>
</div>
  <!--adding new eateries -->
        <div class="eateries-container">

  <a href="./images/kanha.jpg" target="_blank" class="card clickable-card">
    <div class="title-small">Kanha's</div>
  </a>

<a href="./images/nescafe.jpg" target="_blank" class="card clickable-card">
    <div class="title-small">Nescafe</div>
  </a>

<a href="./images/domino.jpg" target="_blank" class="card clickable-card">
    <div class="title-small">Domino's</div>
  </a>

  <a href="./images/shuchi-menu.jpg" target="_blank" class="card clickable-card">
    <div class="title-small">Shuchi</div>
  </a>

  <a href="./images/bhr-menu.jpg" target="_blank" class="card clickable-card">
    <div class="title-small">BHR's canteen</div>
  </a>

</div>
  <!--done here -->
 

    <!-- Mess Card -->
    <div class="card mess-card-section" id="messCardSection">
      <div class="mess-card-header">🪪 Your Mess Card</div>

      <!-- Empty state -->
      <div id="messCardEmpty">
        <p class="mess-card-hint">Upload once — tap to show at the mess entrance anytime.</p>
        <label class="upload-label" id="uploadLabel">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
            <circle cx="12" cy="13" r="4"/>
          </svg>
          Upload Mess Card
          <input type="file" id="messCardInput" accept="image/*">
        </label>
        <p class="mess-card-privacy">Stored only on this device &nbsp;·&nbsp; never uploaded</p>
      </div>

      <!-- Stored state -->
      <div id="messCardStored" class="hidden">
        <img id="messCardThumb" alt="Your mess card">
        <div class="mess-card-actions">
          <button id="showCardBtn" class="primary-btn">Show Mess Card</button>
          <div class="mess-card-secondary">
            <label class="replace-label">
              Replace
              <input type="file" id="messCardReplace" accept="image/*">
            </label>
            <button id="deleteCardBtn" class="delete-card-btn">Remove</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Fullscreen overlay -->
    <div id="messCardOverlay" class="hidden" role="dialog" aria-modal="true" aria-label="Mess Card">
      <img id="messCardFull" alt="Your mess card">
      <button id="overlayCloseBtn" aria-label="Close">✕</button>
    </div>

    <!-- Instagram -->
    <div class="footer">
        <a class="insta-btn" href="https://www.instagram.com/dattaraj_dhatbale/" target="_blank">
            <img id="instaIcon" class="insta-icon" src="">
            <span class="insta-text">dee dee</span>
        </a>
</div>

</div>


<!-- Script -->
<script src="./script.js"></script>
<script defer src="/_vercel/insights/script.js"></script>
</body>

</html>
